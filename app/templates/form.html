{% extends 'base.html' %}{% block title %}{{ title }} · Ledgerwise{% endblock %}{% block content %}<div class="card form-card"><div class="card-body p-4"><h1 class="h3 mb-4">{{ title }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if action=='register' %}<label class="form-label" for="company">Company name</label><input id="company" class="form-control mb-3" name="company" autocomplete="organization" required><label class="form-label" for="name">Administrator name</label><input id="name" class="form-control mb-3" name="name" autocomplete="name" required><label class="form-label" for="email">Email</label><input id="email" class="form-control mb-3" name="email" type="email" autocomplete="email" required><label class="form-label" for="currency">Currency</label><input id="currency" class="form-control mb-3" name="currency" value="INR" maxlength="3" required><label class="form-label" for="password">Password (at least 10 characters)</label><input id="password" class="form-control mb-3" name="password" type="password" minlength="10" autocomplete="new-password" required><label class="form-label" for="confirm-password">Confirm password</label><input id="confirm-password" class="form-control mb-3" name="confirm_password" type="password" minlength="10" autocomplete="new-password" required>{% elif action=='login' %}<label class="form-label">Email</label><input class="form-control mb-3" name="email" type="email" autocomplete="email" required><label class="form-label">Password</label><input class="form-control mb-3" name="password" type="password" autocomplete="current-password" required>{% elif action=='opening' %}<label class="form-label">Date</label><input class="form-control mb-3" name="date" type="date" value="{{ today or '' }}" required><label class="form-label">Cash/bank account</label><select class="form-select mb-3" name="cash_account">{% for a in accounts %}<option value="{{ a.id }}">{{ a.code }} · {{ a.name }}</option>{% endfor %}</select><label class="form-label">Opening balance</label><input class="form-control mb-3" name="amount" type="number" min="0.01" step="0.01" required>{% elif action=='transfer' %}<label class="form-label">Date</label><input class="form-control mb-3" name="date" type="date" required><label class="form-label">From</label><select class="form-select mb-3" name="from_account">{% for a in accounts %}<option value="{{ a.id }}">{{ a.code }} · {{ a.name }}</option>{% endfor %}</select><label class="form-label">To</label><select class="form-select mb-3" name="to_account">{% for a in accounts %}<option value="{{ a.id }}">{{ a.code }} · {{ a.name }}</option>{% endfor %}</select><label class="form-label">Amount</label><input class="form-control mb-3" name="amount" type="number" min="0.01" step="0.01" required>{% endif %}<button class="btn btn-primary">{{ 'Create company and administrator' if action=='register' else 'Submit' }}</button></form></div></div>{% endblock %}
