{% extends 'base.html' %}{% block title %}Edit Account · Ledgerwise{% endblock %}{% block content %}<div class="form-card"><div class="card"><div class="card-body p-4"><h1 class="h3 mb-3">Edit account</h1>{% if used %}<div class="alert alert-info">Posted entries use this account. Its type, classification, and cash/bank status are locked; you may update its code or display name.</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Code</label><input class="form-control mb-3" name="code" maxlength="20" value="{{ account.code }}" required><label class="form-label">Name</label><input class="form-control mb-3" name="name" maxlength="120" value="{{ account.name }}" required><label class="form-label">Type</label><select class="form-select mb-3" name="account_type" required>{% for t in ['asset','liability','equity','income','expense'] %}<option value="{{ t }}" {{ 'selected' if account.account_type==t else '' }}>{{ t|title }}</option>{% endfor %}</select><label class="form-label">Cash-flow classification</label><select class="form-select mb-3" name="cash_flow_classification"><option value="">Select… (required for non-cash)</option>{% for c in ['operating','investing','financing'] %}<option value="{{ c }}" {{ 'selected' if account.cash_flow_classification==c else '' }}>{{ c|title }}</option>{% endfor %}</select><div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="is_cash" id="is-cash" {{ 'checked' if account.is_cash else '' }}><label class="form-check-label" for="is-cash">Cash/Bank asset</label></div><button class="btn btn-primary">Save changes</button> <a class="btn btn-outline-secondary" href="{{ url_for('main.accounts') }}">Cancel</a></form></div></div></div>{% endblock %}
