{% extends 'base.html' %}{% block content %}<h1 class="h2">Team</h1><div class="row g-4"><div class="col-md-5"><div class="card"><div class="card-body"><h2 class="h5">Add accountant</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Name</label><input class="form-control mb-3" name="name" required><label class="form-label">Email</label><input class="form-control mb-3" name="email" type="email" required><label class="form-label">Temporary password (10+ characters)</label><input class="form-control mb-3" name="password" type="password" minlength="10" required><button class="btn btn-primary">Create accountant</button></form></div></div></div><div class="col-md-7"><div class="card"><div class="card-body"><h2 class="h5">Company users</h2>{% for u in users %}<p class="border-bottom py-2 mb-0">{{ u.name }} · {{ u.email }} <span class="badge text-bg-secondary">{{ u.role }}</span></p>{% endfor %}</div></div></div></div>{% endblock %}
